name: Build and notify Bing

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
        inputs:
            base_sha:
                description: "Previous commit SHA for incremental submission. Leave blank for a site-wide update."
                required: false
                type: string

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            checks: read

        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Cache Hugo resources
              uses: actions/cache@v4
              env:
                  cache-name: cache-hugo-resources
              with:
                  path: resources
                  key: ${{ env.cache-name }}

            - uses: actions/setup-go@v5
              with:
                  go-version: "1.27.x"
            - run: go version

            - name: Setup Hugo
              uses: peaceiris/actions-hugo@v3
              with:
                  hugo-version: "0.170.1"
                  dart-sass-version: "1.108.2"

            - name: Build
              run: hugo --minify --gc

            - name: Wait for Cloudflare Pages production deployment
              if: >-
                  github.repository == 'lslvxy/laysan.site' &&
                  github.ref == 'refs/heads/main' &&
                  (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              timeout-minutes: 6
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  echo "Waiting for the Cloudflare Pages check on ${GITHUB_SHA}."
                  for ((attempt = 1; attempt <= 30; attempt++)); do
                      conclusion=$(gh api \
                          "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=Cloudflare%20Pages&filter=latest" \
                          --jq 'first(.check_runs[] | select(
                              .app.slug == "cloudflare-workers-and-pages" and
                              ((.details_url // "") | contains("/pages/view/laysan/"))
                          )) | .conclusion // empty')
                      case "$conclusion" in
                          success) exit 0 ;;
                          "") sleep 10 ;;
                          *) echo "::error::Cloudflare Pages finished with: $conclusion"; exit 1 ;;
                      esac
                  done
                  echo "::error::Timed out waiting for Cloudflare Pages."
                  exit 1

            - name: Notify Bing via IndexNow
              if: >-
                  github.repository == 'lslvxy/laysan.site' &&
                  github.ref == 'refs/heads/main' &&
                  (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
              env:
                  BASE_SHA: ${{ github.event.before || inputs.base_sha }}
              run: |
                  if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -z "$BASE_SHA" ]]; then
                      python3 .github/scripts/indexnow.py --all
                  else
                      python3 .github/scripts/indexnow.py --base "$BASE_SHA"
                  fi
